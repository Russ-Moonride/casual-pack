<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'Helvetica Neue', Calibri, sans-serif">
  <!-- axes -->
  <line x1="100" y1="70" x2="100" y2="410" stroke="#8A6B70" stroke-width="1.5"/>
  <line x1="100" y1="410" x2="950" y2="410" stroke="#8A6B70" stroke-width="1.5"/>
  <text x="525" y="452" text-anchor="middle" font-size="15" fill="#5C5C5C">time &#8594;</text>
  <text x="52" y="240" text-anchor="middle" font-size="15" fill="#5C5C5C" transform="rotate(-90 52 240)">conversion rate</text>

  <!-- effect region (counterfactual upper, observed lower) -->
  <polygon points="540,278 930,205 930,292 600,305 540,278" fill="#B85042" fill-opacity="0.20"/>

  <!-- intervention line -->
  <line x1="540" y1="78" x2="540" y2="410" stroke="#6D2E46" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="540" y="62" text-anchor="middle" font-size="16" font-weight="700" fill="#6D2E46">intervention (price hike)</text>

  <!-- pre-period observed (solid maroon) -->
  <polyline points="120,332 210,324 300,313 390,301 470,289 540,278" fill="none" stroke="#6D2E46" stroke-width="3.5"/>
  <!-- counterfactual continuation (dashed gold) -->
  <polyline points="540,278 930,205" fill="none" stroke="#C99A2E" stroke-width="3" stroke-dasharray="9 6"/>
  <!-- post observed (solid maroon, drops below) -->
  <polyline points="540,278 600,305 930,292" fill="none" stroke="#6D2E46" stroke-width="3.5"/>

  <!-- effect double-arrow at x=770 -->
  <line x1="780" y1="234" x2="780" y2="297" stroke="#B85042" stroke-width="2"/>
  <polygon points="780,234 775,244 785,244" fill="#B85042"/>
  <polygon points="780,297 775,287 785,287" fill="#B85042"/>
  <text x="795" y="270" text-anchor="start" font-size="16" font-weight="700" fill="#B85042">causal effect</text>

  <!-- labels -->
  <text x="305" y="388" text-anchor="middle" font-size="14" fill="#6D2E46">pre-period: fit the trend</text>
  <text x="928" y="196" text-anchor="end" font-size="14" font-weight="600" fill="#B07A14">counterfactual (model)</text>
  <text x="928" y="312" text-anchor="end" font-size="14" font-weight="600" fill="#6D2E46">observed</text>
</svg>
