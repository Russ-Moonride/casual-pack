<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" font-family="'Helvetica Neue', Calibri, sans-serif">
  <!-- axis baseline -->
  <line x1="300" y1="48" x2="300" y2="356" stroke="#8A6B70" stroke-width="1.5"/>
  <text x="600" y="392" text-anchor="middle" font-size="14" fill="#5C5C5C">cost per trial — PyTensor task pack</text>

  <!-- bars: scale $0.82 -> 620px (756 px per $) -->
  <!-- Opus no skill -->
  <text x="288" y="92" text-anchor="end" font-size="16" fill="#2A2A2A">Opus · no skill</text>
  <rect x="300" y="60" width="620" height="48" rx="4" fill="#A26769"/>
  <text x="934" y="92" font-size="16" font-weight="700" fill="#6D2E46">$0.82</text>
  <!-- Opus + skill -->
  <text x="288" y="164" text-anchor="end" font-size="16" fill="#2A2A2A">Opus · + skill</text>
  <rect x="300" y="132" width="454" height="48" rx="4" fill="#6D2E46"/>
  <text x="768" y="164" font-size="16" font-weight="700" fill="#6D2E46">$0.60</text>
  <!-- Sonnet no skill -->
  <text x="288" y="236" text-anchor="end" font-size="16" fill="#2A2A2A">Sonnet · no skill</text>
  <rect x="300" y="204" width="68" height="48" rx="4" fill="#A26769"/>
  <text x="382" y="236" font-size="16" font-weight="700" fill="#6D2E46">$0.09</text>
  <!-- Sonnet + skill (hero) -->
  <text x="288" y="308" text-anchor="end" font-size="16" font-weight="700" fill="#5A2438">Sonnet · + skill</text>
  <rect x="300" y="276" width="65" height="48" rx="4" fill="#E8C87A" stroke="#6D2E46" stroke-width="2"/>
  <text x="379" y="308" font-size="16" font-weight="700" fill="#6D2E46">$0.086</text>

  <!-- callout: 9.5x cheaper, matched quality -->
  <rect x="430" y="270" width="430" height="60" rx="10" fill="#F6E9D9" stroke="#6D2E46" stroke-width="2"/>
  <text x="645" y="296" text-anchor="middle" font-size="17" font-weight="700" fill="#6D2E46">≈ 9.5× cheaper than Opus baseline</text>
  <text x="645" y="318" text-anchor="middle" font-size="14" font-style="italic" fill="#A26769">at the same 94% quality (see previous slide)</text>

  <!-- bottom note -->
  <text x="600" y="424" text-anchor="middle" font-size="15" font-style="italic" fill="#6D2E46">The skill stops the model re-deriving the API → it iterates less → fewer tokens.</text>
</svg>
