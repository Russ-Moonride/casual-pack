<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Helvetica Neue', Calibri, sans-serif">
  <!-- three columns -->
  <!-- 1 Observational -->
  <rect x="20" y="40" width="368" height="400" rx="14" fill="#FBF8F4" stroke="#A26769" stroke-width="2"/>
  <text x="204" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#6D2E46">Observational</text>
  <text x="204" y="124" text-anchor="middle" font-size="17" font-style="italic" fill="#8A6B70">you only observe</text>
  <text x="204" y="200" text-anchor="middle" font-size="18" fill="#4A4A4A">adjust for confounders</text>
  <text x="204" y="232" text-anchor="middle" font-size="18" fill="#4A4A4A">DAGs · propensity scores</text>
  <text x="204" y="264" text-anchor="middle" font-size="18" fill="#4A4A4A">regression</text>

  <!-- 2 Quasi-experimental (highlighted) -->
  <rect x="416" y="40" width="368" height="400" rx="14" fill="#F6E9D9" stroke="#6D2E46" stroke-width="4"/>
  <rect x="528" y="22" width="144" height="34" rx="17" fill="#B85042"/>
  <text x="600" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#FAF6F1">we focus here</text>
  <text x="600" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#6D2E46">Quasi-experimental</text>
  <text x="600" y="132" text-anchor="middle" font-size="17" font-style="italic" fill="#8A6B70">nature or policy assigns it</text>
  <rect x="468" y="170" width="264" height="46" rx="9" fill="#E8C87A" stroke="#6D2E46" stroke-width="1.5"/>
  <text x="600" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#5A2438">Interrupted Time Series</text>
  <text x="600" y="262" text-anchor="middle" font-size="18" fill="#4A4A4A">Difference-in-Differences</text>
  <text x="600" y="294" text-anchor="middle" font-size="18" fill="#4A4A4A">Regression Discontinuity</text>
  <text x="600" y="326" text-anchor="middle" font-size="18" fill="#4A4A4A">Synthetic Control</text>

  <!-- 3 Experimental -->
  <rect x="812" y="40" width="368" height="400" rx="14" fill="#FBF8F4" stroke="#A26769" stroke-width="2"/>
  <text x="996" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#6D2E46">Experimental</text>
  <text x="996" y="124" text-anchor="middle" font-size="17" font-style="italic" fill="#8A6B70">you randomize</text>
  <text x="996" y="200" text-anchor="middle" font-size="18" fill="#4A4A4A">A/B test · RCT</text>
  <text x="996" y="232" text-anchor="middle" font-size="18" fill="#4A4A4A">the gold standard —</text>
  <text x="996" y="264" text-anchor="middle" font-size="18" fill="#4A4A4A">when you can run one</text>

  <!-- spectrum arrow -->
  <line x1="60" y1="500" x2="1140" y2="500" stroke="#8A6B70" stroke-width="2"/>
  <polygon points="1140,500 1126,492 1126,508" fill="#8A6B70"/>
  <text x="60"  y="532" text-anchor="start" font-size="16" font-style="italic" fill="#5C5C5C">no control over who gets treated</text>
  <text x="1140" y="532" text-anchor="end" font-size="16" font-style="italic" fill="#5C5C5C">full control</text>
</svg>
