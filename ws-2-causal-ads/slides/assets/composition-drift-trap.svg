<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Helvetica Neue', Calibri, sans-serif">
  <rect x="0" y="0" width="1200" height="520" fill="none"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#6D2E46"/>
    </marker>
  </defs>

  <text x="600" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#6D2E46">
    The story the no-skill run tells itself
  </text>

  <!-- left panel -->
  <rect x="40" y="70" width="510" height="380" rx="16" fill="#FBF8F4" stroke="#A26769" stroke-width="2"/>
  <text x="295" y="105" text-anchor="middle" font-size="18" font-weight="700" fill="#6D2E46">Inputs the run looks at</text>

  <!-- mini plot 1: signups flat -->
  <g transform="translate(78,135)">
    <text x="0" y="-10" font-size="15" font-weight="700" fill="#2A2A2A">signups</text>
    <line x1="0" y1="90" x2="150" y2="90" stroke="#C8B8B0"/>
    <line x1="0" y1="90" x2="0" y2="0" stroke="#C8B8B0"/>
    <path d="M0,48 C30,45 58,51 88,47 S130,49 150,46" fill="none" stroke="#C99A2E" stroke-width="4"/>
    <line x1="102" y1="0" x2="102" y2="90" stroke="#B85042" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="75" y="113" text-anchor="middle" font-size="13" fill="#5C5C5C">flat across treatment</text>
  </g>

  <!-- mini plot 2: conversions flat -->
  <g transform="translate(308,135)">
    <text x="0" y="-10" font-size="15" font-weight="700" fill="#2A2A2A">conversions</text>
    <line x1="0" y1="90" x2="150" y2="90" stroke="#C8B8B0"/>
    <line x1="0" y1="90" x2="0" y2="0" stroke="#C8B8B0"/>
    <path d="M0,56 C28,54 55,57 82,55 S126,56 150,54" fill="none" stroke="#A26769" stroke-width="4"/>
    <line x1="102" y1="0" x2="102" y2="90" stroke="#B85042" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="75" y="113" text-anchor="middle" font-size="13" fill="#5C5C5C">roughly stable</text>
  </g>

  <!-- mini plot 3: subscriber_pool grows -->
  <g transform="translate(78,300)">
    <text x="0" y="-10" font-size="15" font-weight="700" fill="#2A2A2A">subscriber_pool</text>
    <line x1="0" y1="90" x2="150" y2="90" stroke="#C8B8B0"/>
    <line x1="0" y1="90" x2="0" y2="0" stroke="#C8B8B0"/>
    <path d="M0,78 C28,70 55,61 82,50 S126,31 150,20" fill="none" stroke="#6D2E46" stroke-width="4"/>
    <line x1="102" y1="0" x2="102" y2="90" stroke="#B85042" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="75" y="113" text-anchor="middle" font-size="13" fill="#5C5C5C">keeps growing</text>
  </g>

  <!-- formula -->
  <rect x="295" y="305" width="210" height="78" rx="10" fill="#6D2E46"/>
  <text x="400" y="333" text-anchor="middle" font-size="15" font-weight="700" fill="#FAF6F1">conv_rate</text>
  <text x="400" y="357" text-anchor="middle" font-size="15" fill="#FAF6F1">= conversions</text>
  <text x="400" y="379" text-anchor="middle" font-size="15" fill="#FAF6F1">/ subscriber_pool</text>

  <path d="M535,260 C575,260 595,260 625,260" fill="none" stroke="#6D2E46" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- right panel -->
  <rect x="650" y="70" width="510" height="380" rx="16" fill="#F7EDEA" stroke="#B85042" stroke-width="2"/>
  <text x="905" y="105" text-anchor="middle" font-size="18" font-weight="700" fill="#B85042">The tempting conclusion</text>

  <g transform="translate(705,140)">
    <text x="185" y="-10" text-anchor="middle" font-size="15" font-weight="700" fill="#2A2A2A">if numerator flat and denominator grows...</text>
    <line x1="0" y1="170" x2="370" y2="170" stroke="#C8B8B0"/>
    <line x1="0" y1="170" x2="0" y2="0" stroke="#C8B8B0"/>
    <text x="-8" y="10" text-anchor="end" font-size="12" fill="#5C5C5C">higher rate</text>
    <text x="-8" y="170" text-anchor="end" font-size="12" fill="#5C5C5C">lower rate</text>
    <text x="185" y="198" text-anchor="middle" font-size="12" fill="#5C5C5C">time</text>
    <path d="M0,58 C58,68 112,81 165,97 S294,135 370,150" fill="none" stroke="#6D2E46" stroke-width="5"/>
    <line x1="235" y1="0" x2="235" y2="170" stroke="#B85042" stroke-width="2.5" stroke-dasharray="7 6"/>
    <text x="235" y="190" text-anchor="middle" font-size="12" fill="#B85042">price hike</text>
    <text x="185" y="48" text-anchor="middle" font-size="14" fill="#6D2E46">smooth mechanical decline</text>
  </g>

  <rect x="698" y="350" width="414" height="58" rx="10" fill="#FFFFFF" stroke="#B85042" stroke-width="1.5"/>
  <text x="905" y="375" text-anchor="middle" font-size="16" font-style="italic" fill="#2A2A2A">“Maybe the drop is just composition drift,</text>
  <text x="905" y="398" text-anchor="middle" font-size="16" font-style="italic" fill="#2A2A2A">not a treatment effect.”</text>

  <!-- bottom tell -->
  <rect x="165" y="466" width="870" height="38" rx="10" fill="#C99A2E"/>
  <text x="600" y="491" text-anchor="middle" font-size="17" font-weight="700" fill="#5A2438">
    The tell: this story predicts a continuous drift — not a sharp break exactly at the treatment date.
  </text>
</svg>
