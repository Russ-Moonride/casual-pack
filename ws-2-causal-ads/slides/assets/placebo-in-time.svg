<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Helvetica Neue', Calibri, sans-serif">
  <rect x="0" y="0" width="1200" height="520" fill="none"/>

  <!-- axes -->
  <line x1="90" y1="405" x2="1115" y2="405" stroke="#8A6B70" stroke-width="1.6"/>
  <line x1="90" y1="90" x2="90" y2="405" stroke="#8A6B70" stroke-width="1.6"/>
  <text x="600" y="452" text-anchor="middle" font-size="16" fill="#5C5C5C">time</text>
  <text x="42" y="250" text-anchor="middle" font-size="16" fill="#5C5C5C" transform="rotate(-90 42 250)">conversion rate</text>

  <!-- period bands -->
  <rect x="115" y="96" width="690" height="298" rx="10" fill="#FBF8F4" stroke="#E8C87A" stroke-width="1.5"/>
  <rect x="805" y="96" width="280" height="298" rx="10" fill="#F7EDEA" stroke="#A26769" stroke-width="1.5"/>
  <text x="460" y="125" text-anchor="middle" font-size="15" font-style="italic" fill="#8A6B70">pre-period only: fit and refit here</text>
  <text x="945" y="125" text-anchor="middle" font-size="15" font-style="italic" fill="#8A6B70">real post-period</text>

  <!-- observed series -->
  <polyline points="125,330 200,322 275,314 350,301 425,292 500,279 575,266 650,252 725,240 805,228"
            fill="none" stroke="#6D2E46" stroke-width="3.5"/>
  <polyline points="805,228 865,268 940,285 1015,278 1080,274"
            fill="none" stroke="#6D2E46" stroke-width="3.5"/>

  <!-- real counterfactual -->
  <polyline points="805,228 1080,176" fill="none" stroke="#C99A2E" stroke-width="3" stroke-dasharray="9 7"/>
  <polygon points="805,228 1080,176 1080,274 865,268" fill="#B85042" fill-opacity="0.16"/>

  <!-- real intervention -->
  <line x1="805" y1="88" x2="805" y2="405" stroke="#6D2E46" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="805" y="70" text-anchor="middle" font-size="17" font-weight="700" fill="#6D2E46">real treatment</text>
  <text x="805" y="420" text-anchor="middle" font-size="13" fill="#6D2E46">2026-04-01</text>

  <!-- fake treatment dates -->
  <g stroke="#A26769" stroke-width="2" stroke-dasharray="5 5">
    <line x1="265" y1="150" x2="265" y2="405"/>
    <line x1="405" y1="150" x2="405" y2="405"/>
    <line x1="545" y1="150" x2="545" y2="405"/>
    <line x1="685" y1="150" x2="685" y2="405"/>
  </g>
  <g fill="#A26769" font-size="13" text-anchor="middle">
    <text x="265" y="420">−360d</text>
    <text x="405" y="420">−270d</text>
    <text x="545" y="420">−180d</text>
    <text x="685" y="420">−90d</text>
  </g>
  <g fill="#A26769">
    <circle cx="265" cy="315" r="6"/>
    <circle cx="405" cy="294" r="6"/>
    <circle cx="545" cy="271" r="6"/>
    <circle cx="685" cy="246" r="6"/>
  </g>
  <text x="475" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#A26769">fake treatments</text>

  <!-- small placebo gaps -->
  <g stroke="#A26769" stroke-width="2">
    <line x1="340" y1="305" x2="340" y2="296"/>
    <polygon points="340,305 336,298 344,298" fill="#A26769"/>
    <polygon points="340,296 336,303 344,303" fill="#A26769"/>
    <line x1="620" y1="255" x2="620" y2="248"/>
    <polygon points="620,255 616,248 624,248" fill="#A26769"/>
    <polygon points="620,248 616,255 624,255" fill="#A26769"/>
  </g>
  <text x="490" y="220" text-anchor="middle" font-size="15" fill="#A26769">placebo gaps ≈ 0</text>

  <!-- real gap -->
  <line x1="980" y1="195" x2="980" y2="282" stroke="#B85042" stroke-width="3"/>
  <polygon points="980,195 974,207 986,207" fill="#B85042"/>
  <polygon points="980,282 974,270 986,270" fill="#B85042"/>
  <text x="1000" y="244" font-size="17" font-weight="700" fill="#B85042">real gap</text>
  <text x="1000" y="266" font-size="14" fill="#B85042">stands out</text>

  <!-- callout -->
  <rect x="160" y="32" width="880" height="42" rx="8" fill="#6D2E46"/>
  <text x="600" y="59" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="700" fill="#FAF6F1">
    If the model finds effects before treatment, don't trust the effect after treatment.
  </text>

  <!-- bottom rule -->
  <rect x="265" y="462" width="670" height="38" rx="7" fill="#FBF8F4" stroke="#C99A2E"/>
  <text x="600" y="487" text-anchor="middle" font-size="16" fill="#6D2E46">
    Pass condition: fake-date effects cluster around zero; the real-date effect is separated.
  </text>
</svg>
