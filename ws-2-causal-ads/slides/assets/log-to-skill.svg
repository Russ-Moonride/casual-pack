<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" font-family="'Helvetica Neue', Calibri, sans-serif">
  <!-- four nodes -->
  <!-- Run (top-left) -->
  <rect x="110" y="60" width="320" height="96" rx="12" fill="#6D2E46"/>
  <text x="270" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#FAF6F1">Run</text>
  <text x="270" y="128" text-anchor="middle" font-size="14" fill="#E6D5C9">let the agent do the analysis</text>
  <!-- Log (top-right) -->
  <rect x="770" y="60" width="320" height="96" rx="12" fill="#FBF8F4" stroke="#A26769" stroke-width="2"/>
  <text x="930" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#6D2E46">Log → logs.txt</text>
  <text x="930" y="124" text-anchor="middle" font-size="14" fill="#4A4A4A">what worked · where it stumbled</text>
  <text x="930" y="144" text-anchor="middle" font-size="13" font-style="italic" fill="#8A6B70">(syntax · wrong args · false assumptions)</text>
  <!-- Critique (bottom-right) -->
  <rect x="770" y="300" width="320" height="96" rx="12" fill="#FBF8F4" stroke="#A26769" stroke-width="2"/>
  <text x="930" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#6D2E46">Critique</text>
  <text x="930" y="368" text-anchor="middle" font-size="14" fill="#4A4A4A">distil the recurring failures</text>
  <!-- Skill (bottom-left) -->
  <rect x="110" y="300" width="320" height="96" rx="12" fill="#E8C87A" stroke="#6D2E46" stroke-width="2"/>
  <text x="270" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#5A2438">Skill</text>
  <text x="270" y="368" text-anchor="middle" font-size="14" fill="#6D2E46">write / update SKILL.md</text>

  <!-- clockwise arrows -->
  <g stroke="#6D2E46" stroke-width="2.5" fill="#6D2E46">
    <line x1="430" y1="108" x2="766" y2="108"/><polygon points="766,108 754,102 754,114"/>
    <line x1="930" y1="156" x2="930" y2="296"/><polygon points="930,296 924,284 936,284"/>
    <line x1="770" y1="348" x2="434" y2="348"/><polygon points="434,348 446,342 446,354"/>
    <line x1="270" y1="300" x2="270" y2="160"/><polygon points="270,160 264,172 276,172"/>
  </g>

  <!-- center label -->
  <text x="600" y="222" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#6D2E46">each pass → better</text>
  <text x="600" y="248" text-anchor="middle" font-size="14" font-style="italic" fill="#A26769">the fumble is the raw material</text>

  <!-- bottom caption -->
  <text x="600" y="440" text-anchor="middle" font-size="16" font-style="italic" fill="#6D2E46">Run 1: no skill → it fumbles. Log it → distil a skill. Run 2: clean.</text>
</svg>
