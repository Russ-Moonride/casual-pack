<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" font-family="'Helvetica Neue', Calibri, sans-serif">
  <!-- cards -->
  <g>
    <rect x="20"  y="30" width="376" height="380" rx="14" fill="#FBF8F4" stroke="#A26769" stroke-width="2"/>
    <rect x="412" y="30" width="376" height="380" rx="14" fill="#FBF8F4" stroke="#A26769" stroke-width="2"/>
    <rect x="804" y="30" width="376" height="380" rx="14" fill="#FBF8F4" stroke="#A26769" stroke-width="2"/>
  </g>

  <!-- number badges -->
  <circle cx="70"  cy="92" r="26" fill="#6D2E46"/><text x="70"  y="101" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#FAF6F1">1</text>
  <circle cx="462" cy="92" r="26" fill="#6D2E46"/><text x="462" y="101" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#FAF6F1">2</text>
  <circle cx="854" cy="92" r="26" fill="#6D2E46"/><text x="854" y="101" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#FAF6F1">3</text>

  <!-- titles -->
  <text x="112" y="101" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#6D2E46">Auth + sharing</text>
  <text x="504" y="101" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#6D2E46">Connect local apps</text>
  <text x="896" y="101" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#6D2E46">A remote service</text>

  <!-- descriptions -->
  <text x="48" y="172" font-size="18" fill="#4A4A4A">A custom internal server bundles</text>
  <text x="48" y="198" font-size="18" fill="#4A4A4A">authenticated tools for your team.</text>
  <text x="440" y="172" font-size="18" fill="#4A4A4A">Your agent drives a tool running</text>
  <text x="440" y="198" font-size="18" fill="#4A4A4A">on your own machine.</text>
  <text x="832" y="172" font-size="18" fill="#4A4A4A">Consume a hosted MCP you</text>
  <text x="832" y="198" font-size="18" fill="#4A4A4A">don't run yourself.</text>

  <!-- tool chips -->
  <rect x="108" y="276" width="200" height="56" rx="10" fill="#E8C87A" stroke="#6D2E46" stroke-width="1.5"/>
  <text x="208" y="312" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#5A2438">Daimon</text>
  <rect x="500" y="276" width="200" height="56" rx="10" fill="#E8C87A" stroke="#6D2E46" stroke-width="1.5"/>
  <text x="600" y="312" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#5A2438">marimo</text>
  <rect x="892" y="276" width="200" height="56" rx="10" fill="#E8C87A" stroke="#6D2E46" stroke-width="1.5"/>
  <text x="992" y="312" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#5A2438">Context7</text>

  <!-- chip sublabels -->
  <text x="208" y="372" text-anchor="middle" font-size="16" font-style="italic" fill="#8A6B70">Discord · Notion, one config line</text>
  <text x="600" y="372" text-anchor="middle" font-size="16" font-style="italic" fill="#8A6B70">Claude Code ↔ local notebook</text>
  <text x="992" y="372" text-anchor="middle" font-size="16" font-style="italic" fill="#8A6B70">always-fresh package docs</text>

  <!-- build-your-own bar -->
  <rect x="360" y="462" width="480" height="52" rx="26" fill="#6D2E46"/>
  <text x="600" y="495" text-anchor="middle" font-size="19" fill="#FAF6F1">Build your own &#8594; <tspan font-weight="700">FastMCP</tspan></text>
</svg>
