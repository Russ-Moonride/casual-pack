<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="'Helvetica Neue', Calibri, sans-serif">
  <!-- Agent (client) -->
  <rect x="24" y="120" width="240" height="170" rx="12" fill="#6D2E46"/>
  <text x="144" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#FAF6F1">Your agent</text>
  <text x="144" y="220" text-anchor="middle" font-size="15" fill="#E6D5C9">MCP client</text>
  <text x="144" y="242" text-anchor="middle" font-size="13" fill="#C9A6AE">Claude Code · Cursor · …</text>

  <!-- arrow 1 -->
  <line x1="270" y1="205" x2="430" y2="205" stroke="#6D2E46" stroke-width="2.5"/>
  <polygon points="430,205 418,199 418,211" fill="#6D2E46"/>
  <text x="350" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#6D2E46">MCP protocol</text>
  <text x="350" y="230" text-anchor="middle" font-size="13" font-style="italic" fill="#8A6B70">stdio · HTTP</text>

  <!-- MCP server -->
  <rect x="436" y="40" width="430" height="330" rx="12" fill="#FBF8F4" stroke="#6D2E46" stroke-width="3"/>
  <rect x="436" y="40" width="430" height="46" rx="12" fill="#E8C87A"/>
  <text x="651" y="71" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#5A2438">MCP server</text>
  <!-- three primitives -->
  <rect x="460" y="104" width="382" height="62" rx="8" fill="#FFFFFF" stroke="#A26769" stroke-width="1.5"/>
  <text x="476" y="130" font-size="17" font-weight="700" fill="#6D2E46">Tools</text>
  <text x="476" y="152" font-size="14" fill="#4A4A4A">actions the agent can call — send_message, query_db…</text>
  <rect x="460" y="176" width="382" height="62" rx="8" fill="#FFFFFF" stroke="#A26769" stroke-width="1.5"/>
  <text x="476" y="202" font-size="17" font-weight="700" fill="#6D2E46">Resources</text>
  <text x="476" y="224" font-size="14" fill="#4A4A4A">data the agent can read — files, records, docs</text>
  <rect x="460" y="248" width="382" height="62" rx="8" fill="#FFFFFF" stroke="#A26769" stroke-width="1.5"/>
  <text x="476" y="274" font-size="17" font-weight="700" fill="#6D2E46">Prompts</text>
  <text x="476" y="296" font-size="14" fill="#4A4A4A">reusable templates the server offers</text>
  <text x="651" y="344" text-anchor="middle" font-size="14" font-style="italic" fill="#B07A14">+ holds the credentials (auth)</text>

  <!-- arrow 2 -->
  <line x1="872" y1="205" x2="978" y2="205" stroke="#6D2E46" stroke-width="2.5"/>
  <polygon points="978,205 966,199 966,211" fill="#6D2E46"/>
  <text x="925" y="186" text-anchor="middle" font-size="13" font-style="italic" fill="#8A6B70">wraps</text>

  <!-- backends -->
  <rect x="984" y="120" width="192" height="170" rx="12" fill="#F6E9D9" stroke="#A26769" stroke-width="2"/>
  <text x="1080" y="158" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#6D2E46">the real thing</text>
  <text x="1080" y="190" text-anchor="middle" font-size="14" fill="#4A4A4A">Notion · Discord</text>
  <text x="1080" y="214" text-anchor="middle" font-size="14" fill="#4A4A4A">DB · files</text>
  <text x="1080" y="238" text-anchor="middle" font-size="14" fill="#4A4A4A">any API / SaaS</text>

  <!-- caption -->
  <text x="600" y="408" text-anchor="middle" font-size="16" font-style="italic" fill="#6D2E46">The agent speaks one standard protocol (JSON-RPC, local or remote); each server translates it to its backend — and holds the credentials.</text>
</svg>
